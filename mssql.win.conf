#
# Mandatory: no
# Default:
# Plugins.MSSQL.Default.User=

### Option: Plugins.MSSQL.Default.Password
#	Password to send to protected MSSQL server.
#   This value is used if no other is specified.
#
# Mandatory: no
# Default:
